<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Barnstorm - Gig Manager</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Manage your gigs with The Barnstorm band">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barnstorm">
    
    <!-- App Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent horizontal scrolling */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }
        
        /* Ensure all elements use border-box sizing */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        /* Mobile touch optimizations */
        * {
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.1);
            touch-action: manipulation; /* Disables double-tap zoom */
        }
        
        /* Minimum touch target size for mobile */
        button, a, input, select {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Focus visible for keyboard navigation */
        *:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }
        
        /* Hide focus outline for mouse users */
        *:focus:not(:focus-visible) {
            outline: none;
        }
        
        /* Skeleton loader animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        
        /* Pagination container */
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        /* Screen reader only class */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        /* Hamburger menu for mobile */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 8px;
        }
        
        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            transition: all 0.3s;
        }
        
        /* Mobile navigation dropdown */
        .mobile-nav-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            min-width: 200px;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        .mobile-nav-dropdown.show {
            display: flex;
            flex-direction: column;
        }
        
        .mobile-nav-dropdown button {
            width: 100%;
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid #3f3f46;
            transition: background-color 0.2s;
        }
        
        .mobile-nav-dropdown button:last-child {
            border-bottom: none;
        }
        
        .mobile-nav-dropdown button:hover {
            background-color: #27272a;
        }
        
        /* Mobile calendar optimizations */
        @media (max-width: 768px) {
            .calendar-grid {
                font-size: 0.75rem;
            }
            
            .calendar-day {
                min-height: 70px;
            }
            
            /* Better event name display on mobile */
            .gig-event-name {
                font-size: 0.7rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
            }
            
            /* Show hamburger, hide desktop nav */
            .hamburger {
                display: flex;
            }
            
            .desktop-nav {
                display: none;
            }
            
            /* Smaller logo on mobile */
            .app-logo {
                height: 2.5rem;
            }
            
            .app-header {
                padding: 0.75rem 1rem;
            }
        }
        
        /* Desktop: hide hamburger, show nav */
        @media (min-width: 769px) {
            .hamburger {
                display: none;
            }
            
            .mobile-nav-dropdown {
                display: none !important;
            }
            
            .desktop-nav {
                display: flex;
            }
        }
        
        /* Tablet adjustments */
        @media (min-width: 640px) and (max-width: 768px) {
            .gig-event-name {
                font-size: 0.75rem;
            }
        }
        
        /* Checkbox styling for better visibility */
        input[type="checkbox"] {
            accent-color: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app" role="main">
        <div class="min-h-screen bg-black flex items-center justify-center">
            <div class="text-white text-xl" role="status" aria-live="polite">Loading...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
        import { getMessaging, getToken, onMessage, isSupported } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js';

        // *** REPLACE THIS URL WITH YOUR APPS SCRIPT WEB APP URL ***
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbyjxPmvRrNPM5EItGBWuhZ4zTsq2yd0s4eQSPrg2VAxcPP4RUorVMCR8Qj6tsL2-xVY/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyDhYBUzbpBBv40-X6SLASGikxoMUWcCU5Q",
            authDomain: "barnstorm-gig-manager.firebaseapp.com",
            projectId: "barnstorm-gig-manager",
            storageBucket: "barnstorm-gig-manager.firebasestorage.app",
            messagingSenderId: "819468934815",
            appId: "1:819468934815:web:9959740caf4bec736eccaa"
        };

        // *** REPLACE THIS WITH YOUR FIREBASE CLOUD MESSAGING "WEB PUSH CERTIFICATE" KEY ***
        // Find it in: Firebase Console > Project Settings > Cloud Messaging tab > Web configuration > Web Push certificates
        const VAPID_KEY = 'BOo_BMJFsabOHZyEZdHLfQkBlkAotKbt5rdIzwVxgIOQuhz7ljUD0f20Fjn1wqUPqeYiTD_qAFt-rOiuWVtvZZ4';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const OWNER_UID = 'jpHnAHzT1nPDZRkAIeANcSIPzLN2';
        // FIX 1: Force download parameter for better mobile compatibility
        const LOGO_URL = 'https://www.dropbox.com/scl/fi/05pdxbaub02h1qa6pk9dp/Barnstorm-Logo.jpg?rlkey=8fghkclk4vvz0nxjkr2dninl5&st=1q1vn1b1&raw=1';

        let currentUser = null;
        let gigs = [];
        let members = [];
        let currentView = 'list';
        let viewMode = 'calendar';
        let currentCalendarDate = new Date();
        let showMyGigsOnly = false;
        let searchQuery = '';
        let mediaSearchQuery = '';
        let gigsCache = null;
        let gigsCacheTimestamp = null;
        
        // Pagination state
        let currentPage = 1;
        let itemsPerPage = 10;
        let totalPages = 1;
        
        // Touch handling for mobile swipe
        let touchStartX = 0;
        let touchEndX = 0;
        
        // Previous render state to avoid unnecessary re-renders
        let lastRenderedGigsState = null;
        let membersUnsubscribe = null;
        let messagesUnsubscribe = null;

        onAuthStateChanged(auth, (user) => {
            console.log('=== AUTH STATE CHANGED ===');
            console.log('User:', user);
            if (user) {
                console.log('User logged in - UID:', user.uid);
                console.log('User email:', user.email);
                console.log('User displayName:', user.displayName);
                
                const isOwner = user.uid === OWNER_UID;
                console.log('Is owner?', isOwner);
                
                currentUser = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || user.email.split('@')[0],
                    role: isOwner ? 'owner' : 'member'
                };
                
                console.log('CurrentUser object:', currentUser);
                console.log('About to call loadMembers()');
                loadMembers();
                console.log('About to call loadGigsFromSheet()');
                loadGigsFromSheet();
                console.log('About to call showMainApp()');
                showMainApp();
                console.log('=== AUTH STATE PROCESSING COMPLETE ===');
            } else {
                console.log('No user logged in');
                currentUser = null;
                showLogin();
            }
        });

        function loadMembers() {
            // Unsubscribe from previous listener if exists
            if (membersUnsubscribe) {
                membersUnsubscribe();
            }
            
            // Only subscribe when members view is active or needed
            membersUnsubscribe = onSnapshot(query(collection(db, 'members'), orderBy('name', 'asc')), (snapshot) => {
                const newMembers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Update currentUser.name if we find a matching member by email
                if (currentUser && currentUser.email) {
                    const matchingMember = newMembers.find(m => 
                        m.email && m.email.toLowerCase() === currentUser.email.toLowerCase()
                    );
                    
                    if (matchingMember && matchingMember.name) {
                        const oldName = currentUser.name;
                        currentUser.name = matchingMember.name;
                        console.log('✅ Updated currentUser.name from:', oldName, 'to:', currentUser.name);
                        
                        // If name changed and we're viewing a gig detail, refresh it
                        if (oldName !== currentUser.name && currentView === 'gigs') {
                            console.log('Name updated - forcing gig view refresh');
                            lastRenderedGigsState = null; // Force re-render
                            if (document.getElementById('gigsContainer')) {
                                renderGigs();
                            }
                        }
                    }
                }
                
                // Only update if members actually changed
                if (JSON.stringify(newMembers) !== JSON.stringify(members)) {
                    members = newMembers;
                    
                    // Only re-render if we're on the members view
                    if (currentView === 'members' && document.getElementById('membersGrid')) {
                        renderMembers();
                    }
                }
            });
        }

        async function loadGigsFromSheet(forceRefresh = false) {
            console.log('=== LOAD GIGS FROM SHEET START ===');
            console.log('forceRefresh:', forceRefresh);
            
            const now = Date.now();
            const cacheExpiry = 5 * 60 * 1000;
            
            console.log('Cache check - gigsCache exists?', !!gigsCache);
            console.log('Cache check - gigsCacheTimestamp:', gigsCacheTimestamp);
            console.log('Cache check - age:', now - gigsCacheTimestamp, 'ms');
            
            if (!forceRefresh && gigsCache && gigsCacheTimestamp && (now - gigsCacheTimestamp) < cacheExpiry) {
                console.log('Using cached gigs data - count:', gigsCache.length);
                gigs = gigsCache;
                if (document.getElementById('gigsContainer')) {
                    console.log('gigsContainer exists, calling renderGigs()');
                    renderGigs();
                } else {
                    console.log('gigsContainer does not exist yet');
                }
                return;
            }
            
            console.log('Fetching fresh data from API...');

            const container = document.getElementById('gigsContainer');
            if (container) {
                container.innerHTML = renderSkeletonLoader();
                container.setAttribute('aria-busy', 'true');
            }

            // Try to load cached data first for instant display
            const cachedData = localStorage.getItem('barnstorm_gigs_cache');
            const cacheTimestamp = localStorage.getItem('barnstorm_gigs_cache_time');
            const cacheAge = cacheTimestamp ? Date.now() - parseInt(cacheTimestamp) : Infinity;
            
            // If cache is less than 5 minutes old, use it immediately
            if (cachedData && cacheAge < 5 * 60 * 1000) {
                console.log('Using cached data (age: ' + Math.round(cacheAge / 1000) + 's)');
                try {
                    const cachedGigs = JSON.parse(cachedData);
                    gigs = cachedGigs;
                    console.log('Loaded ' + gigs.length + ' gigs from cache');
                    
                    // Render immediately with cached data
                    if (container) {
                        container.removeAttribute('aria-busy');
                    }
                    renderGigs();
                    
                    // Still fetch fresh data in background to update cache
                    // But don't show loading indicator since we have cached data
                } catch (e) {
                    console.error('Error parsing cached data:', e);
                }
            }

            try {
                console.log('Fetching fresh data from:', GOOGLE_SHEET_API_URL);
                
                if (GOOGLE_SHEET_API_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
                    throw new Error('You need to replace YOUR_APPS_SCRIPT_WEB_APP_URL_HERE with your actual Apps Script URL');
                }
                
                const response = await fetch(GOOGLE_SHEET_API_URL);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`Failed to fetch gigs: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                console.log('=== API RESPONSE RECEIVED ===');
                console.log('typeof data:', typeof data);
                console.log('Is data an array?', Array.isArray(data));
                console.log('data keys:', Object.keys(data));
                console.log('data.gigs exists?', 'gigs' in data);
                console.log('Is data.gigs an array?', Array.isArray(data.gigs));
                if (data.gigs) {
                    console.log('data.gigs length:', data.gigs.length);
                }
                console.log('First 1000 chars of data:', JSON.stringify(data).substring(0, 1000));
                console.log('Full data object keys and types:');
                for (const key in data) {
                    console.log(`  ${key}: ${typeof data[key]}, isArray: ${Array.isArray(data[key])}`);
                }
                
                // Handle both old and new API formats
                let gigsArray = data.gigs || data;
                console.log('After extraction - gigsArray type:', typeof gigsArray);
                console.log('After extraction - is array?', Array.isArray(gigsArray));
                
                // If it's not an array, something is wrong
                if (!Array.isArray(gigsArray)) {
                    console.error('gigsArray is not an array:', gigsArray);
                    throw new Error('Invalid data format received from API');
                }
                
                console.log('gigsArray length BEFORE transform:', gigsArray.length);
                console.log('First gig BEFORE transform:', gigsArray[0]);
                
                // Transform data to maintain compatibility
                gigsArray = gigsArray.map(gig => {
                    // Check if this is the NEW format (with role/name) or OLD format (already has memberName)
                    const musicians = (gig.musicians || []).map(m => {
                        // New format: { role: 'drums', name: 'John' }
                        if (m.role && m.name && !m.memberName) {
                            return {
                                instrument: m.role,
                                memberName: m.name,
                                isNA: m.isNA,
                                isNeed: m.isNeed,
                                originalName: m.originalName
                            };
                        }
                        // Old format: already has memberName and instrument
                        return m;
                    });
                    
                    const production = (gig.production || []).map(p => {
                        // New format: { role: 'a1', name: 'Jane' }
                        if (p.role && p.name && !p.memberName) {
                            return {
                                instrument: p.role,
                                memberName: p.name,
                                isNA: p.isNA,
                                isNeed: p.isNeed,
                                originalName: p.originalName
                            };
                        }
                        // Old format: already has memberName and instrument
                        return p;
                    });
                    
                    // Ensure media object exists
                    const media = gig.media || {};
                    
                    // Handle bandInfo - might be at top level or in bandInfo object
                    const bandInfo = gig.bandInfo || {
                        showInfoUrl: gig.showInfoUrl,
                        notes: gig.notes || ''
                    };
                    
                    return {
                        ...gig,
                        musicians,
                        production,
                        media,
                        bandInfo
                    };
                });
                
                console.log('gigsArray length AFTER transform:', gigsArray.length);
                console.log('First gig AFTER transform:', gigsArray[0]);
                
                console.log('=== SETTING GIGS ARRAY ===');
                gigs = gigsArray;
                gigsCache = gigsArray;
                gigsCacheTimestamp = now;
                console.log('gigs variable now has', gigs.length, 'items');
                console.log('gigsCache now has', gigsCache.length, 'items');
                
                // Store in localStorage for instant future loads
                try {
                    localStorage.setItem('barnstorm_gigs_cache', JSON.stringify(gigs));
                    localStorage.setItem('barnstorm_gigs_cache_time', Date.now().toString());
                    console.log('Data cached in localStorage');
                } catch (e) {
                    console.error('Error caching to localStorage:', e);
                }
                
                // Reset render state to force a re-render with new data
                lastRenderedGigsState = null;
                console.log('Render state reset');
                
                if (container) {
                    container.setAttribute('aria-busy', 'false');
                    console.log('Container aria-busy set to false');
                }
                
                // Only render if the container exists
                const gigsContainerCheck = document.getElementById('gigsContainer');
                console.log('Checking for gigsContainer:', !!gigsContainerCheck);
                if (gigsContainerCheck) {
                    console.log('=== CALLING renderGigs() ===');
                    renderGigs();
                    console.log('=== renderGigs() call complete ===');
                } else {
                    console.log('WARNING: gigsContainer not found, skipping render');
                }
                console.log('=== LOAD GIGS FROM SHEET COMPLETE ===');
            } catch (error) {
                console.error('Error loading gigs:', error);
                if (container) {
                    container.setAttribute('aria-busy', 'false');
                    container.innerHTML = `
                        <div role="alert" class="text-red-500 text-center py-8">
                            <p class="mb-4">Error loading gigs: ${escapeHtml(error.message)}</p>
                            <button onclick="window.retryLoadGigs()" class="px-4 py-2 bg-white text-black font-bold uppercase text-sm hover:bg-zinc-200 transition-colors">
                                Retry
                            </button>
                        </div>
                    `;
                }
            }
        }
        
        // Helper function to escape HTML and prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Extract city and state from full address
        function extractCityState(address) {
            if (!address) return '';
            
            // Common patterns:
            // "123 Main St, New York, NY 10001"
            // "123 Main St, Brooklyn, NY"
            // "Venue Name, 123 Main St, New York, NY"
            
            const parts = address.split(',').map(p => p.trim());
            
            if (parts.length >= 2) {
                // Get last two parts (usually "City" and "State ZIP")
                const state = parts[parts.length - 1];
                const city = parts[parts.length - 2];
                
                // Extract just state abbreviation (first 2 letters before any digits)
                const stateMatch = state.match(/^([A-Z]{2})/);
                const stateAbbr = stateMatch ? stateMatch[1] : state.trim();
                
                return `${city}, ${stateAbbr}`;
            }
            
            return address;
        }
        
        // Skeleton loader for better perceived performance
        function renderSkeletonLoader() {
            return `
                <div class="space-y-4" role="status" aria-label="Loading gigs">
                    ${Array(3).fill(0).map(() => `
                        <div class="bg-zinc-900 border border-zinc-800 p-6">
                            <div class="skeleton h-6 w-48 mb-4 rounded"></div>
                            <div class="skeleton h-4 w-32 mb-2 rounded"></div>
                            <div class="skeleton h-4 w-64 rounded"></div>
                        </div>
                    `).join('')}
                    <span class="sr-only">Loading gigs, please wait...</span>
                </div>
            `;
        }
        
        window.retryLoadGigs = function() {
            loadGigsFromSheet(true);
        };

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-black flex items-center justify-center p-4">
                    <div class="bg-zinc-900 border-2 border-white rounded-lg p-8 max-w-md w-full">
                        <div class="flex justify-center mb-6">
                            <img src="${LOGO_URL}" alt="The Barnstorm logo" class="h-32 object-contain" loading="eager">
                        </div>
                        <h1 class="text-4xl font-bold text-white mb-2 text-center">THE BARNSTORM</h1>
                        <p class="text-zinc-400 text-center mb-8 uppercase text-sm">Gig Manager</p>
                        <form id="loginForm" class="space-y-4" onsubmit="return false;">
                            <div>
                                <label for="loginEmail" class="block text-white mb-2 text-xs uppercase">Email</label>
                                <input 
                                    type="email" 
                                    id="loginEmail" 
                                    autocomplete="email" 
                                    required
                                    aria-required="true"
                                    class="w-full px-4 py-3 bg-black border border-zinc-700 text-white focus:outline-none focus:border-white"
                                >
                            </div>
                            <div>
                                <label for="loginPassword" class="block text-white mb-2 text-xs uppercase">Password</label>
                                <input 
                                    type="password" 
                                    id="loginPassword" 
                                    autocomplete="current-password" 
                                    required
                                    aria-required="true"
                                    class="w-full px-4 py-3 bg-black border border-zinc-700 text-white focus:outline-none focus:border-white"
                                >
                            </div>
                            <button 
                                id="loginBtn" 
                                type="submit"
                                class="w-full py-3 bg-white text-black font-bold uppercase hover:bg-zinc-200 transition-colors"
                                aria-label="Login to your account"
                            >
                                Login
                            </button>
                        </form>
                        <div id="loginError" class="mt-4 text-red-500 text-sm hidden" role="alert" aria-live="polite"></div>
                    </div>
                </div>
            `;

            const form = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const errorDiv = document.getElementById('loginError');

                try {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Logging in...';
                    loginBtn.setAttribute('aria-busy', 'true');
                    
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    errorDiv.textContent = 'Invalid email or password';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    loginBtn.setAttribute('aria-busy', 'false');
                }
            });
        }

        function showMainApp() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-black">
                    <!-- Mobile-optimized header -->
                    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 app-header" role="banner">
                        <div class="container mx-auto px-4 py-4">
                            <div class="flex items-center justify-between gap-4">
                                <div class="flex items-center gap-3">
                                    <img src="${LOGO_URL}" alt="The Barnstorm" class="h-10 md:h-16 app-logo object-contain" loading="eager" onerror="this.style.display='none'">
                                    <div>
                                        <h1 class="text-lg md:text-2xl font-bold text-white uppercase">THE BARNSTORM</h1>
                                        <p class="text-zinc-400 text-xs uppercase">Gig Manager</p>
                                    </div>
                                </div>
                                
                                <!-- Hamburger menu for mobile -->
                                <div class="relative">
                                    <button 
                                        class="hamburger" 
                                        onclick="window.toggleMobileMenu()"
                                        aria-label="Toggle menu"
                                        aria-expanded="false"
                                        id="hamburgerBtn"
                                    >
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </button>
                                    
                                    <!-- Mobile dropdown menu -->

            const userName = currentUser.name?.toLowerCase().trim() || '';
            const memberNameLower = memberName.toLowerCase().trim();
            
            // Exact full name match (most common case)
            if (memberNameLower === userName) return true;
            
            // Split into parts and require BOTH first AND last name to match
            const userParts = userName.split(/[\s@._-]+/).filter(p => p.length > 0);
            const memberParts = memberNameLower.split(/[\s@._-]+/).filter(p => p.length > 0);
            
            // Need at least first and last name for both
            if (userParts.length < 2 || memberParts.length < 2) {
                return false; // Can't reliably match with just one name
            }
            
            // Extract first and last name from each
            const userFirst = userParts[0];
            const userLast = userParts[userParts.length - 1];
            const memberFirst = memberParts[0];
            const memberLast = memberParts[memberParts.length - 1];
            
            // Both first AND last must match exactly (no partial matches)
            if (userFirst === memberFirst && userLast === memberLast) {
                return true;
            }
            
            return false;
        };
        
        // Mark member as N/A for a gig
        window.markAsNA = async function(gigId, type, index, memberName, role) {
            console.log('markAsNA called with:', { gigId, type, index, memberName, role });
            console.log('Current user:', currentUser.name);
            
            // SECURITY: Strict check - both first AND last name must match exactly
            const userName = currentUser.name?.toLowerCase().trim() || '';
            const memberNameLower = memberName.toLowerCase().trim();
            
            // Split into parts
            const userParts = userName.split(/[\s@._-]+/).filter(p => p.length > 0);
            const memberParts = memberNameLower.split(/[\s@._-]+/).filter(p => p.length > 0);
            
            // Exact full match
            let isMatch = userName === memberNameLower;
            
            // Or first + last name match
            if (!isMatch && userParts.length >= 2 && memberParts.length >= 2) {
                const userFirst = userParts[0];
                const userLast = userParts[userParts.length - 1];
                const memberFirst = memberParts[0];
                const memberLast = memberParts[memberParts.length - 1];
                isMatch = (userFirst === memberFirst && userLast === memberLast);
            }
            
            if (!isMatch) {
                alert(`You can only mark yourself as N/A.\n\nYou are logged in as: ${currentUser.name}\nYou tried to mark: ${memberName}\n\nIf this is your name spelled differently, please contact booking@thebarnstorm.com.`);
                console.log('Name mismatch - access denied');

            console.log('Name match confirmed - proceeding');
            
            const gig = gigs.find(g => g.id === gigId);

                alert('Gig not found');
                return;
            }
            
            const confirmMsg = `Are you sure you want to mark yourself as N/A for "${gig.eventName}" on ${gig.date}?\n\nThis will notify booking@thebarnstorm.com that a sub is needed.`;
            
            if (!confirm(confirmMsg)) return;
            
            try {

                const modal = document.querySelector('[role="dialog"]');

                }

                    method: 'POST',
                    mode: 'no-cors', // Bypass CORS preflight
                    headers: {

                    body: JSON.stringify({

                    })

                console.log('Request sent successfully');
                
                // With no-cors mode, we can't read the response

                if (type === 'musician' && gig.musicians && gig.musicians[index]) {

                                    if (memberPart.length > 2 && 
                                        (userPart.includes(memberPart) || memberPart.includes(userPart))) {
                                        return true;
                                    }
                                }
                            }
                        }
                        
                        return false;
                    });
                    
                    const isProduction = production.some(p => {
                        const memberName = (p.memberName || '').toLowerCase().trim();
                        const userNameLower = userName.toLowerCase().trim();
                        
                        // Same matching logic
                        if (memberName === userNameLower) return true;
                        if (memberName.includes(userNameLower)) return true;
                        if (userNameLower.includes(memberName)) return true;
                        
                        const userParts = userNameLower.split(/[\s@._-]+/);
                        const memberParts = memberName.split(/[\s@._-]+/);
                        
                        for (const userPart of userParts) {
                            if (userPart.length > 2) {
                                for (const memberPart of memberParts) {
                                    if (memberPart.length > 2 && 
                                        (userPart.includes(memberPart) || memberPart.includes(userPart))) {
                                        return true;
                                    }
                                }
                            }
                        }
                        
                        return false;
                    });
                    
                    return isMusician || isProduction;
                });
                
                console.log('Filtered gigs count after My Gigs:', filtered.length);
                
                if (filtered.length === 0) {
                    console.warn('No gigs found for user:', userName);
                    console.warn('Make sure your Firebase display name matches a name in the Google Sheet');
                }
            }
            
            // Apply search filter
            if (searchQuery) {
                console.log('Applying search filter:', searchQuery);
                try {
                    filtered = filtered.filter(gig => {
                        const searchFields = [
                            gig.eventName || '',
                            gig.venue || '',
                            gig.address || '',
                            gig.type || '',
                            ...(gig.musicians || []).map(m => m.memberName || ''),
                            ...(gig.production || []).map(p => p.memberName || ''),
                            gig.media?.photographer || '',
                            gig.media?.vendors || ''
                        ];
                        
                        const searchableText = searchFields.join(' ').toLowerCase();
                        return searchableText.includes(searchQuery);
                    });
                    console.log('After search filter:', filtered.length);
                } catch (error) {
                    console.error('Error in search filter:', error);
                    // Return unfiltered if search fails
                }
            }
            
            // Safety check: ensure we always return an array
            console.log('getFilteredGigs: Returning', filtered.length, 'gigs');
            return Array.isArray(filtered) ? filtered : [];
        }

        function renderGigs() {
            const container = document.getElementById('gigsContainer');
            if (!container) {
                console.log('No gigsContainer element found');
                return;
            }

            console.log('renderGigs called, gigs.length:', gigs.length);
            
            const filteredGigs = getFilteredGigs();

            const today = new Date().toISOString().split('T')[0];

            // Create a state signature to check if we need to re-render

                calendarMonth: viewMode === 'calendar' ? `${currentCalendarDate.getFullYear()}-${currentCalendarDate.getMonth()}` : null

            if (currentState === lastRenderedGigsState) {

            if (viewMode === 'calendar') {

        }

        function renderPagination() {

        function renderCalendar(container, filteredGigs) {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            // Adjust for Monday start: 0=Sunday becomes 6, 1=Monday becomes 0, etc.
            let startDay = firstDay.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;
            
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            // Update month label in the navigation
            const monthLabel = document.getElementById('currentMonthLabel');
            if (monthLabel) {
                monthLabel.textContent = `${monthNames[month]} ${year}`;
            }
            
            const gigsByDate = {};
            filteredGigs.forEach(g => {
                const date = new Date(g.date + 'T00:00:00');
                if (date.getFullYear() === year && date.getMonth() === month) {
                    const day = date.getDate();
                    if (!gigsByDate[day]) gigsByDate[day] = [];
                    gigsByDate[day].push(g);
                }
            });
            
            container.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 overflow-x-auto">
                    <div class="grid grid-cols-7 border-b border-zinc-800">
                        ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => `
                            <div class="p-2 text-center text-zinc-400 text-xs font-bold uppercase border-r border-zinc-800 last:border-r-0" role="columnheader">${day}</div>
                        `).join('')}
                    </div>
                    <div class="grid grid-cols-7" role="grid" aria-label="Calendar for ${monthNames[month]} ${year}">
                        ${Array(startDay).fill(0).map(() => '<div class="min-h-20 sm:min-h-24 md:min-h-28 p-2 border-r border-b border-zinc-800 bg-black" role="gridcell"></div>').join('')}
                        
                        ${Array(daysInMonth).fill(0).map((_, i) => {
                            const day = i + 1;
                            // Adjust dayOfWeek for Monday start: Monday=0, Sunday=6
                            let dayOfWeek = (startDay + day - 1) % 7;
                            const isWeekend = dayOfWeek === 5 || dayOfWeek === 6; // Saturday or Sunday
                            const hasGigs = gigsByDate[day] && gigsByDate[day].length > 0;
                            const today = new Date();
                            const cellDate = new Date(year, month, day);
                            const isToday = today.toDateString() === cellDate.toDateString();
                            const isPast = cellDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());
                            
                            return `
                                <div 
                                    class="calendar-day min-h-20 sm:min-h-24 md:min-h-28 p-1 sm:p-2 border-r border-b border-zinc-800 ${isWeekend ? 'bg-zinc-950' : 'bg-black'} ${isToday ? 'ring-2 ring-white' : ''} ${isPast ? 'opacity-50' : ''} ${hasGigs ? 'cursor-pointer hover:bg-zinc-800' : ''} last:border-r-0"
                                    ${hasGigs ? `onclick="window.handleCalendarDayClick(${year}, ${month}, ${day})"` : ''}
                                    role="gridcell"
                                    aria-label="${day} ${monthNames[month]} ${year}${hasGigs ? `, ${gigsByDate[day].length} gig${gigsByDate[day].length > 1 ? 's' : ''}` : ''}"
                                    ${hasGigs ? 'tabindex="0"' : ''}
                                >
                                    <div class="text-zinc-400 text-xs sm:text-sm font-bold mb-1 ${isPast ? 'line-through' : ''}">${day}</div>
                                    ${hasGigs ? `
                                        <div class="space-y-1">
                                            ${gigsByDate[day].slice(0, 2).map(g => `
                                                <div class="bg-gradient-to-br from-purple-600 to-purple-800 hover:from-purple-500 hover:to-purple-700 border border-purple-500 p-1 sm:p-1.5 rounded transition-all ${isPast ? 'opacity-75' : ''}">
                                                    <div class="gig-event-name text-white font-bold leading-tight">${escapeHtml(g.eventName || 'Event')}</div>
                                                    <div class="text-purple-100 text-xs truncate leading-tight hidden sm:block">${escapeHtml(g.venue || '')}</div>
                                                </div>
                                            `).join('')}
                                            ${gigsByDate[day].length > 2 ? `
                                                <div class="text-zinc-400 text-xs">+${gigsByDate[day].length - 2} more</div>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                        
                        ${(() => {
                            const totalCells = startDay + daysInMonth;
                            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
                            return Array(remainingCells).fill(0).map(() => 
                                '<div class="min-h-20 sm:min-h-24 md:min-h-28 p-2 border-r border-b border-zinc-800 bg-black last:border-r-0" role="gridcell"></div>'
                            ).join('');
                        })()}
                    </div>
                </div>
            `;
            
            // Clear pagination for calendar view
            const paginationContainer = document.getElementById('paginationContainer');
            if (paginationContainer) {
                paginationContainer.innerHTML = '';
            }
        }

        window.deleteReferral = async function(referralId) {
            if (!confirm('Clear this referral? This removes it and its response tracking - it cannot be undone.')) return;

            try {
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'deleteReferral',
                        referralId: referralId
                    })
                });
                // With no-cors we can't read the response, but the list
                // will update automatically once Firestore reflects the delete.
            } catch (err) {
                console.error('Delete referral error:', err);
                alert('There was a problem clearing that referral. Please try again.');
            }
        };

        window.onReferralToggle = async function(detailsEl, referralId, leadId) {
            if (!detailsEl.open) return; // only load the first time it's opened, not on close

            const elId = 'referralLeadInfo-' + referralId;
            const el = document.getElementById(elId);
            if (!el || el.dataset.loaded === 'true') return;

            if (!leadId) {
                el.innerHTML = '<span class="text-zinc-600 text-sm">No linked Insightly lead for this referral.</span>';
                el.dataset.loaded = 'true';
                return;
            }

            el.innerHTML = '<span class="text-zinc-500 text-sm">Looking up lead info...</span>';
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL + '?action=lookupContactById&leadId=' + encodeURIComponent(leadId));
                const data = await response.json();
                const freshEl = document.getElementById(elId);
                if (!freshEl) return;
                freshEl.innerHTML = buildLeadInfoCardHtml(data);
                freshEl.dataset.loaded = 'true';
            } catch (err) {
                console.error('Referral lead info lookup error:', err);
                const freshEl = document.getElementById(elId);
                if (freshEl) freshEl.innerHTML = '<span class="text-zinc-600 text-sm">Couldn\'t load lead info.</span>';
            }
        };

        window.submitReferral = async function() {
            const individualPhones = Array.from(document.querySelectorAll('.referral-individual-checkbox:checked')).map(cb => cb.value);

            if (individualPhones.length === 0) {
                alert('Select at least one bandleader to send to.');

                eventType: document.getElementById('refEventType').value.trim(),

                headcount: document.getElementById('refHeadcount').value.trim(),
                budget: document.getElementById('refBudget').value.trim(),
                moreInfo: document.getElementById('refMoreInfo').value.trim()
            };

            window.closeNewReferralForm();

            try {
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'createReferral',
                        details: details,
                        individualPhones: individualPhones,
                        insightlyLeadId: currentReferralLeadId
                    })
                });
                // With no-cors we can't read the response, but the referral
                // and its status will appear here automatically once

                console.error('Create referral error:', err);

        function renderChannelColumn(channel) {
            const containerId = channel === 'whatsapp' ? 'whatsappColumn' : 'smsColumn';
            const container = document.getElementById(containerId);
            if (!container) return;

            const selected = channel === 'whatsapp' ? selectedWhatsappConversation : selectedSmsConversation;
            const channelMessages = allMessages.filter(m => (m.channel || 'sms') === channel);

            if (selected) {
                renderConversationThread(container, selected, channel);
            } else {
                renderConversationList(container, channelMessages, channel);
            }
        }

        // Consistent color coding: blue for SMS, green for WhatsApp
        function channelColors(channel) {
            return channel === 'whatsapp'
                ? { dot: 'bg-green-500', border: 'border-green-800', borderUnread: 'border-green-400', text: 'text-green-400', bubble: 'bg-green-800', unreadBg: 'bg-green-800' }
                : { dot: 'bg-blue-500', border: 'border-blue-800', borderUnread: 'border-blue-400', text: 'text-blue-400', bubble: 'bg-blue-900', unreadBg: 'bg-blue-800' };
        }

        let smsListLimit = 10;
        let whatsappListLimit = 10;

        function renderConversationList(container, messages, channel) {
            if (messages.length === 0) {
                container.innerHTML = '<p class="text-zinc-500">No messages yet.</p>';
                return;
            }

            // Group messages by the other party's phone number
            const byNumber = {};
            messages.forEach(m => {
                const num = contactNumberFor(m) || 'Unknown';
                if (!byNumber[num]) byNumber[num] = [];
                byNumber[num].push(m);
            });

            // Sort conversations by their most recent message, newest first
            const conversations = Object.keys(byNumber).map(num => {
                const msgs = byNumber[num];
                const last = msgs[msgs.length - 1];
                return { number: num, messages: msgs, last };
            }).sort((a, b) => {
                const aTime = a.last.timestamp && a.last.timestamp.toMillis ? a.last.timestamp.toMillis() : 0;
                const bTime = b.last.timestamp && b.last.timestamp.toMillis ? b.last.timestamp.toMillis() : 0;
                return bTime - aTime;
            });

            const colors = channelColors(channel);
            const limit = channel === 'whatsapp' ? whatsappListLimit : smsListLimit;
            const visibleConversations = conversations.slice(0, limit);

            container.innerHTML = `
                <div class="space-y-2" role="list" aria-label="${channel === 'whatsapp' ? 'WhatsApp conversations' : 'SMS conversations'}">
                    ${visibleConversations.map(c => {
                        const when = (c.last.timestamp && typeof c.last.timestamp.toDate === 'function')
                            ? c.last.timestamp.toDate().toLocaleString()
                            : '';
                        const preview = c.last.direction === 'outbound' ? 'You: ' + (c.last.body || '') : (c.last.body || '');
                        const nameElId = 'convName-' + c.number.replace(/[^a-zA-Z0-9]/g, '_');
                        const bodyElId = 'convBody-' + c.number.replace(/[^a-zA-Z0-9]/g, '_');
                        const unreadCount = c.messages.filter(m => m.direction !== 'outbound' && m.read === false).length;
                        const isUnread = unreadCount > 0;
                        return `
                            <button
                                onclick="window.openConversation('${escapeHtml(c.number).replace(/'/g, "\\'")}', '${channel}')"
                                class="w-full text-left ${isUnread ? colors.unreadBg : 'bg-zinc-900'} border ${isUnread ? colors.borderUnread : colors.border} hover:border-zinc-500 p-4 rounded transition-colors"
                                role="listitem"
                            >
                                <div class="flex justify-between items-start mb-1 gap-2">
                                    <span class="text-white font-bold text-sm break-all">
                                        ${isUnread ? `<span class="inline-block w-2 h-2 rounded-full ${colors.dot} mr-1 align-middle"></span>` : ''}
                                        ${channel === 'whatsapp'
                                            ? `<span id="${nameElId}">${escapeHtml(c.number)}</span>`
                                            : ''
                                        }
                                    </span>
                                    ${isUnread ? `<span class="${colors.text} text-xs font-bold uppercase shrink-0">${unreadCount} new</span>` : ''}
                                </div>
                                ${channel === 'sms'
                                    ? `<div id="${bodyElId}"><p class="text-white font-bold text-sm break-all">${escapeHtml(c.number)}</p></div>`
                                    : `<p class="text-zinc-400 text-sm mb-1 break-words truncate">${escapeHtml(preview)}</p>`
                                }
                                <span class="text-zinc-600 text-xs">${escapeHtml(when)}</span>
                            </button>
                        `;
                    }).join('')}
                </div>
                ${conversations.length > limit ? `
                    <button onclick="window.showMoreConversations('${channel}')" class="w-full text-center text-zinc-400 hover:text-white text-sm py-2 mt-2">
                        View more (${conversations.length - limit} older)
                    </button>
                ` : ''}
            `;

            // For SMS (leads), replace the number with Name / Date / Venue / City-State once it loads
            if (channel === 'sms') {
                loadInsightlyNamesForList(visibleConversations.map(c => c.number));
            }
            // For WhatsApp (bandleaders), swap the number for their name from the roster
            if (channel === 'whatsapp') {
                loadRosterNamesForList(visibleConversations);
            }
        }

        window.showMoreConversations = function(channel) {
            if (channel === 'whatsapp') {

            } else {

            }

        };

        let bandleaderRosterCache = null;

        async function getBandleaderRosterCache() {
            if (bandleaderRosterCache) return bandleaderRosterCache;
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL + '?action=getRoster');
                const data = await response.json();
                if (data.success) {
                    bandleaderRosterCache = data.roster;
                }
            } catch (err) {
                console.error('Roster cache load error:', err);
            }
            return bandleaderRosterCache || [];
        }

        async function loadRosterNamesForList(conversations) {
            const roster = await getBandleaderRosterCache();
            if (!roster.length) return;

            conversations.forEach(c => {
                const target = c.number.replace(/\D/g, '').slice(-10);
                const match = roster.find(r => r.phone.replace(/\D/g, '').slice(-10) === target);
                if (!match) return;

                const sanitized = c.number.replace(/[^a-zA-Z0-9]/g, '_');
                ['convName-' + sanitized, 'threadTitle-' + sanitized].forEach(elId => {
                    const el = document.getElementById(elId);
                    if (el) el.textContent = match.name;
                });
            });
        }

        async function loadInsightlyNamesForList(numbers) {
            if (numbers.length === 0) return;
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL + '?action=lookupContactsBatch&phones=' + encodeURIComponent(numbers.join(',')));
                const data = await response.json();
                if (!data.success) return;

                numbers.forEach(number => {
                    const result = data.results[number];
                    const bodyElId = 'convBody-' + number.replace(/[^a-zA-Z0-9]/g, '_');
                    const el = document.getElementById(bodyElId);
                    if (!el || !result || !result.found) return; // leave the number showing if no match

                    const details = [result.eventDate, result.venue, result.cityState].filter(Boolean).join(' \u00b7 ');
                    el.innerHTML = `
                        <p class="text-white font-bold text-sm break-words">${escapeHtml(result.name)}</p>
                        ${details ? `<p class="text-zinc-400 text-sm break-words">${escapeHtml(details)}</p>` : ''}
                    `;
                });
            } catch (err) {
                console.error('Insightly batch name lookup error:', err);
            }
        }

        function renderConversationThread(container, number, channel) {
            const thread = allMessages.filter(m => (m.channel || 'sms') === channel && contactNumberFor(m) === number);
            const colors = channelColors(channel);
            const threadTitleElId = 'threadTitle-' + number.replace(/[^a-zA-Z0-9]/g, '_');

            container.innerHTML = `

                            const when = (m.timestamp && typeof m.timestamp.toDate === 'function')

                                <div class="flex ${isOutbound ? 'justify-end' : 'justify-start'}" role="listitem">
                                    <div class="max-w-[80%] ${isOutbound ? colors.bubble : 'bg-zinc-800'} p-3 rounded">
                                        <p class="text-white text-sm break-words">${escapeHtml(m.body || '')}</p>

                        </button>
                    </div>
                </div>
            `;

            // Scroll thread to the bottom so the latest message is visible
            const threadEl = container.querySelector('[role="list"][aria-label="Message thread"]');
            if (threadEl) threadEl.scrollTop = threadEl.scrollHeight;

            // SMS conversations are leads - look up their Insightly contact info
            if (channel === 'sms') {
                loadInsightlyInfo(number);
            }
            // WhatsApp conversations are bandleaders - show their name from the roster
            if (channel === 'whatsapp') {

        let insightlyDataByNumber = {};

        // Shared builder: same lead-info card layout used in both the
        // SMS thread view and the expanded Referral card.
        function buildLeadInfoCardHtml(data, options) {
            options = options || {};
            if (!data.found) {
                return '<span class="text-zinc-600">No matching Insightly lead found.</span>';
            }

            const contactFields = [
                ['Email', data.email],
                ['Mobile', data.mobile],
                ['Lead Origin', data.leadOrigin]
            ].filter(([label, value]) => value);

            const eventFields = [
                ['Event Date', data.eventDate],
                ['Event Type', data.eventType],
                ['Venue', data.venue],
                ['City/State', data.cityState],
                ['Headcount', data.headcountRange],
                ['Budget', data.budget]
            ].filter(([label, value]) => value);

            const coupleInfo = [data.description, data.otherInfo].filter(Boolean).join('\n\n');

            const fieldBlock = (label, value) => `
                <div>
                    <span class="text-zinc-500 text-xs uppercase block">${escapeHtml(label)}</span>
                    <span class="text-zinc-300 text-sm break-words">${escapeHtml(value)}</span>
                </div>
            `;

            return `
                <div class="bg-zinc-900 border border-zinc-800 rounded p-3">
                    <div class="flex justify-between items-start gap-2">
                        <a href="${escapeHtml(data.insightlyUrl)}" target="_blank" rel="noopener" class="text-blue-400 hover:underline font-bold">${escapeHtml(data.name)}</a>
                        ${options.referButton ? `<button onclick="window.openReferralFromLead('${options.referButton.replace(/'/g, "\\'")}')" class="bg-white text-black font-bold uppercase text-xs px-3 py-1.5 rounded shrink-0">Refer This Lead</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-3 mt-2">
                        <div class="space-y-2">
                            ${contactFields.map(([label, value]) => fieldBlock(label, value)).join('')}
                        </div>
                        <div class="space-y-2">
                            ${eventFields.map(([label, value]) => fieldBlock(label, value)).join('')}
                        </div>
                    </div>
                    ${coupleInfo ? `
                        <div class="mt-3 pt-3 border-t border-zinc-800">
                            <span class="text-zinc-500 text-xs uppercase block mb-1">From the couple</span>
                            <p class="text-zinc-300 text-sm whitespace-pre-line break-words">${escapeHtml(coupleInfo)}</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        async function loadInsightlyInfo(number) {
            const elId = 'insightlyInfo-' + number.replace(/[^a-zA-Z0-9]/g, '_');
            const el = document.getElementById(elId);
            if (!el) return;

            try {
                const response = await fetch(GOOGLE_SHEET_API_URL + '?action=lookupContact&phone=' + encodeURIComponent(number));
                const data = await response.json();

                // Bail out quietly if the user navigated away while this was loading
                const freshEl = document.getElementById(elId);
                if (!freshEl) return;

                if (data.found) {
                    insightlyDataByNumber[number] = data;
                }
                freshEl.innerHTML = buildLeadInfoCardHtml(data, { referButton: number });
            } catch (err) {
                console.error('Insightly lookup error:', err);
                const freshEl = document.getElementById(elId);
                if (freshEl) freshEl.innerHTML = '<span class="text-zinc-600">Couldn\'t load contact info.</span>';
            }
        }

        window.openReferralFromLead = function(number) {
            const data = insightlyDataByNumber[number];
            if (!data) return;

            const moreInfoParts = [];
            if (data.cityState) moreInfoParts.push('Location: ' + data.cityState);
            if (data.description) moreInfoParts.push(data.description);
            if (data.otherInfo) moreInfoParts.push(data.otherInfo);

            window.openNewReferralForm({
                date: data.eventDate || '',
                eventType: data.eventType || '',
                venue: data.venue || '',
                headcount: data.headcountRange || '',
                budget: data.budget || '',
                moreInfo: moreInfoParts.join('\n\n'),
                leadId: data.leadId || ''
            });
        };

        window.openConversation = function(number, channel) {
            if (channel === 'whatsapp') {
                selectedWhatsappConversation = number;
            } else {
                selectedSmsConversation = number;
            }
            renderChannelColumn(channel);
            markConversationRead(number, channel);
        };

        function markConversationRead(number, channel) {
            const unreadIds = allMessages
                .filter(m => (m.channel || 'sms') === channel && contactNumberFor(m) === number && m.direction !== 'outbound' && m.read === false)
                .map(m => m.id);

            if (unreadIds.length === 0) return;

            // Update locally right away so the "new" badge clears instantly
            unreadIds.forEach(id => {
                const msg = allMessages.find(m => m.id === id);
                if (msg) msg.read = true;
            });

            fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'markMessagesRead',
                    messageIds: unreadIds
                })
            }).catch(err => console.error('Mark read error:', err));
        }

        window.backToConversationList = function(channel) {
            if (channel === 'whatsapp') {
                selectedWhatsappConversation = null;
            } else {
                selectedSmsConversation = null;
            }
            renderChannelColumn(channel);
        };

        window.sendReply = async function(number, channel) {
            const input = document.getElementById('replyInput-' + channel);
            if (!input) return;
            const body = input.value.trim();
            if (!body) return;

            input.value = '';
            input.disabled = true;

            try {
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'sendMessage',
                        to: number,
                        body: body,
                        channel: channel
                    })
                });
                // With no-cors we can't read the response, but the sent
                // message will appear here automatically once Apps Script
                // saves it to Firestore (usually within a couple seconds).
            } catch (err) {
                console.error('Send message error:', err);
                alert('There was a problem sending that message. Please try again.');
            } finally {
                input.disabled = false;
                input.focus();
            }
        };

        function renderMediaList() {
            const container = document.getElementById('mediaContainer');
            if (!container) {
                console.log('No mediaContainer element found');
                return;
            }
            
            console.log('renderMediaList called');
            console.log('Total gigs available:', gigs.length);
            
            // Safety check
            if (!Array.isArray(gigs)) {
                console.error('gigs is not an array in renderMediaList');
                container.innerHTML = `
                    <div class="bg-zinc-900 border border-zinc-800 p-8 text-center">
                        <p class="text-red-500 text-lg mb-4">Error loading media data</p>
                        <button onclick="window.switchView('gigs')" class="px-4 py-2 bg-white text-black font-bold uppercase text-xs hover:bg-zinc-200 transition-colors">
                            Back to Gigs
                        </button>
                    </div>
                `;
                return;
            }
            
            // Filter to only past gigs with media
            const today = new Date().toISOString().split('T')[0];
            
            const pastGigsWithMedia = gigs
                .filter(g => {
                    const isPast = g.date < today;
                    const hasMedia = g.media && (g.media.photo || g.media.video || g.media.audio || g.media.videoEdits || g.media.blog);
                    
                    // Apply search filter if search query exists
                    if (mediaSearchQuery && isPast && hasMedia) {
                        const searchFields = [
                            g.eventName || '',
                            g.venue || '',
                            g.address || '',
                            g.media?.photographer || '',
                            g.media?.vendors || ''
                        ];
                        const searchableText = searchFields.join(' ').toLowerCase();
                        return searchableText.includes(mediaSearchQuery);
