# Sends the files in /backend to the Google Apps Script project.
# Runs automatically whenever a file in /backend changes on main,
# and can also be run by hand (Actions tab > Run workflow).
name: Deploy backend to Apps Script

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Point clasp at the backend folder
        env:
          SCRIPT_ID: 1EO0JOWSzzrhlBrwt9cFbl7IOEvvgUDTRY-gs70gCpvyeTERAuSv0fUwj
        run: echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"backend\"}" > .clasp.json

      - name: Push files to Apps Script
        run: clasp push --force

      - name: Update the live deployment (same URL)
        env:
          DEPLOYMENT_ID: AKfycbyjxPmvRrNPM5EItGBWuhZ4zTsq2yd0s4eQSPrg2VAxcPP4RUorVMCR8Qj6tsL2-xVY
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto-deploy from GitHub"
